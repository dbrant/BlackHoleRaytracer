<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Black Hole Raytracer</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <!-- Fills the window. Focusable, so that clicking the view takes focus away from the
         controls (whose arrow keys would otherwise adjust them instead of steering). -->
    <canvas id="view" tabindex="0" aria-label="Raytraced view of a black hole"></canvas>
    <p id="status" class="status">Loading textures…</p>

    <details id="panel" class="panel" open>
        <summary>
            <h1>Schwarzschild black hole</h1>
        </summary>

        <form id="controls" class="controls" onsubmit="return false">
            <header>
                <p>Real-time GPU raytracing around a black hole, using actual field equations.</p>
                <p class="hint">Drag to orbit · scroll or pinch to zoom</p>
            </header>

            <fieldset>
                <legend>Objects</legend>
                <label class="check"><input type="checkbox" id="accretion-disk" checked> Accretion disk</label>
                <label class="check"><input type="checkbox" id="stars"> Stars</label>
                <label class="check"><input type="checkbox" id="planets"> Earth and Mars</label>
                <label class="check"><input type="checkbox" id="mirrors"> Reflective spheres</label>
                <label class="check"><input type="checkbox" id="glass-spheres"> Glass spheres</label>
                <label class="check"><input type="checkbox" id="checkered-disk"> Checkered disk</label>
                <label class="check"><input type="checkbox" id="checkered-spheres"> Checkered spheres</label>
                <label class="check"><input type="checkbox" id="checkered-horizon"> Checkered horizon</label>
                <button type="button" id="randomize">Randomize positions</button>
            </fieldset>

            <fieldset>
                <legend>View</legend>
                <label for="quality">Quality</label>
                <select id="quality">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high" selected>High</option>
                    <option value="very-high">Very high</option>
                    <option value="super">Super</option>
                </select>
                <label for="fov">Field of view <output for="fov"></output></label>
                <input type="range" id="fov" min="20" max="75" step="1" value="55">
                <label for="curvature">Curvature <output for="curvature"></output></label>
                <input type="range" id="curvature" min="0" max="1.5" step="0.01" value="1.5">
                <label for="max-iterations">Max steps per ray <output for="max-iterations"></output></label>
                <input type="range" id="max-iterations" min="250" max="10000" step="250" value="3000">
                <label class="check"><input type="checkbox" id="auto-rotate"> Auto-rotate</label>
                <label class="check"><input type="checkbox" id="low-res-while-moving" checked> Lower resolution while moving</label>
                <button type="button" id="reset-view">Reset view</button>
            </fieldset>

            <p id="stats" class="stats"></p>
            <p class="hint"><kbd>W</kbd>/<kbd>S</kbd> accelerate · arrows to steer<br/>
            <kbd>Space</kbd> to stop</p>

            <p class="credit"><a href="https://dmitrybrant.com" target="_blank">Dmitry Brant</a>, 2026</p>
        </form>
    </details>
</body>
</html>
